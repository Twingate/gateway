# Default values for Twingate Gateway.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

twingate:
  network: ""

twingateOperator:
  # The Gateway and the in-cluster Kubernetes resource are created in the operator's own
  # TWINGATE_REMOTE_NETWORK_ID. Set this only to place them in a different Remote Network.
  # remoteNetworkId: "<remote network id>"
  gateway:
    # Render the TwingateGateway + its TwingateCertificateAuthority. Off for
    # standalone installs with no operator/CRDs.
    enabled: false
    # CA certificate the TwingateCertificateAuthority registers. Certificate defaults to the `ca.crt` of the
    # first TLS certificate Secret: the auto-generated one when
    # `tls.certificates.autoGenerated.enabled` is true, otherwise the first entry of
    # `tls.certificates.secrets`. When the Gateway serves certificates only through
    # `tls.automation`, it defaults to the local issuer's Secret if
    # `tls.automation.issuer.local` is set. For other issuers, either `certificate` or
    # `certificateSecretName` is required.
    certificateAuthority:
      # Name the CA is registered under in Twingate, unique across the network and
      # immutable after install. Defaults to "<fullname>-ca-<hash of the cluster and
      # namespace>"; set it explicitly when rendering without cluster access (helm
      # template, --dry-run=client, Argo CD), where the hash cannot be computed.
      name: ""
      # CA certificate in PEM format.
      certificate: ""
      # Existing Secret containing the CA certificate (key name: ca.crt)
      certificateSecretName: ""
  kubernetesResource:
    # Render a Kubernetes TwingateResource for the in-cluster API server,
    # bound to this gateway via gatewayRef. Requires gateway.enabled=true.
    enabled: false
    # Any TwingateResource spec field passes straight through; the chart owns
    # type/address/gatewayRef and defaults `name` to "<fullname> Kubernetes
    # cluster". If provided, `alias` is also added to the auto-generated TLS cert SANs.
    # name: "My cluster"
    # alias: cluster.int
    # securityPolicyId: "<security policy id>"

auditLog:
  flushInterval: 5m
  flushSizeThreshold: 1000000  # 1MB

# CA bundles the Gateway trusts when verifying upstream TLS connections, on top of the
# system trust store. Each entry is either an existing ConfigMap or an inline PEM bundle.
upstreamCABundles: []
  # - configMapName: "corp-root-ca"
  #   # Optional, defaults to `ca.crt`.
  #   configMapKey: ca.crt
  # - pem: |
  #     -----BEGIN CERTIFICATE-----
  #     ...
  #     -----END CERTIFICATE-----

kubernetes:
  enabled: false

  # External-cluster credentials (testing only). Leave empty to use the pod's
  # service account (in-cluster mode). Upstream routing always comes from the GAT.
  upstreams: []
    # - name: "External Kubernetes Cluster"
    #   # Use bearerToken OR bearerTokenFile
    #   bearerToken: "eyJhbGciOiJSUzI1NiIsImtpZCI6..."
    #   bearerTokenFile: "/var/run/secrets/k8s-token/token"
    #   caFile: "/var/run/secrets/k8s-ca/ca.crt"

ssh:
  enabled: false

  gateway:
    # Username used for all upstream SSH connections
    username: ""
    key:
      # Key type: ed25519, ecdsa, rsa
      type: "ed25519"
      # Key bits: ECDSA: 256/384/521, RSA: 2048/3072/4096 (ignored for ed25519)
      bits: 0
    hostCertificate:
      ttl: "24h"
    userCertificate:
      ttl: "5m"

  # CA configuration - exactly one of manual or vault must be specified when SSH is enabled
  ca: {}
    # Manual CA configuration
    # manual:
    #   # Name of existing secret containing the CA private key (key name: ca-private-key)
    #   existingSecret: ""
    #   # CA private key content (used if existingSecret is not set)
    #   privateKey: ""

    # Vault CA configuration
    # vault:
    #   address: "https://vault.example.com:8200"
    #   namespace: ""  # Optional
    #
    #   # CA bundle for verifying Vault's TLS certificate
    #   caBundle: ""  # CA bundle content (PEM format)
    #   existingCABundleSecret: ""  # Name of existing secret containing CA bundle (key name: ca.crt)
    #
    #   # Auth configuration.
    #   # To authenticate with a Vault token, set the VAULT_TOKEN environment variable through `extraEnvVars` instead.
    #
    #   # An inline secretId is for dev/testing only; in production use
    #   # existingSecretIdSecret so the raw credential never appears in Helm values.
    #   auth:
    #     appRole:
    #       mount: "approle"
    #       roleId: ""
    #       secretId: ""  # SecretID value (dev/testing only)
    #       existingSecretIdSecret: ""  # Name of existing secret containing the AppRole SecretID (key name: secretId)
    #
    #   # Default mount/role (can be overridden per-CA)
    #   mount: "ssh"
    #   role: "gateway"
    #
    #   # Optional: Advanced per-CA overrides
    #   gatewayHostCA:
    #     mount: ""
    #     role: ""
    #   gatewayUserCA:
    #     mount: ""
    #     role: ""
    #   upstreamHostCA:
    #     mount: ""

webApp:
  enabled: false

  # Custom HTTP headers to inject into proxied requests.
  requestHeaders: {}

clusterDomain: cluster.local

# Gateway deployment
replicaCount: 1

image:
  repository: twingate/gateway
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

priorityClassName: ""

# Extra environment variables to add to the container.
#
# extraEnvVars:
#   - name: FOO
#     value: "bar"
extraEnvVars: []

pdb:
  create: false
  # minAvailable: 1
  # maxUnavailable: ""


# TLS configuration for the Gateway
tls:
  certificates:
    # Auto-generate the TLS certificate. Set `certManager.enabled: true` to delegate to
    # cert-manager instead of Helm self-signing. Set `enabled: false` when using only
    # pre-provisioned entries from `secrets`.
    autoGenerated:
      enabled: true
      # IP address to be included as Subject Alternative Names in the TLS cert
      ipAddresses: []
      # DNS names to be included as Subject Alternative Names in the TLS cert. When the Gateway's
      # Kubernetes proxy is enabled (`twingateOperator.kubernetesResource.enabled` or
      # `kubernetes.enabled`), the DNS names of the built-in `kubernetes` Service are added
      # automatically.
      dnsNames: []
      certManager:
        enabled: false
        issuerRef:
          name: ""
          kind: Issuer
          group: cert-manager.io
        commonName: ""
        # Leave empty to use cert-manager defaults.
        duration: ""
        renewBefore: ""
    # TLS certificates the Gateway serves. Each entry is either the name of an existing
    # `kubernetes.io/tls` Secret including the `ca.crt` key or an inline content in PEM format.
    secrets: []
      # Name of an existing secret containing the certificate.
      # - name: "my-tls-secret"
      # Content of the certificate, its key and its CA to be added to the secret
      # - cert: ""
      #   key: ""
      #   ca: ""

  # On-demand TLS certificate issuance. It can be enabled alongside auto-generated TLS certs or existing ones.
  automation:
    enabled: false
    certificate:
      ttl: "24h"
      key:
        # Key type: ecdsa, rsa
        type: "ecdsa"
        # Key bits: ECDSA: 256/384/521, RSA: 2048/3072/4096. 0 uses the default for the type
        # (256 for ECDSA, 2048 for RSA).
        bits: 0

    # Issuer configuration - exactly one issuer must be specified when automation is enabled
    issuer: {}
      # CA keypair the Gateway uses to sign the certificates it issues. Provide either the
      # PEM content inline or the name of an existing Secret holding the certificate under
      # `ca.crt` and the private key under `ca.key`.
      # The operator registers this CA with Twingate unless the Gateway also serves a static
      # certificate or `twingateOperator.gateway.certificateAuthority` provides one.
      # local:
      #   certificate: ""
      #   privateKey: ""
      #   secretName: ""

      # Vault PKI secrets engine. Fetch that mount's own CA certificate for
      # `twingateOperator.gateway.certificateAuthority.certificate` with
      # `vault read -namespace=<namespace> -field=certificate <mount>/cert/ca`.
      # vault:
      #   address: "https://vault.example.com:8200"
      #   namespace: "" # Optional

      #   # CA bundle for verifying Vault's TLS certificate
      #   caBundle: ""  # CA bundle content (PEM format)
      #   caBundleConfigMapName: ""  # Name of existing ConfigMap containing CA bundle (key name: `ca.crt`)
      #
      #   # Auth configuration.
      #   # To authenticate with a Vault token, set the VAULT_TOKEN environment variable through `extraEnvVars` instead.
      #   #
      #   # An inline secretId is for dev/testing only; in production use
      #   # secretIdSecretName so the raw credential never appears in Helm values.
      #   auth:
      #     appRole:
      #       mount: "approle"
      #       roleId: ""
      #       secretIdSecretName: ""  # Name of existing Secret containing the AppRole SecretID (key name: `secretId`)
      #       secretId: ""  # SecretID value (dev/testing only)
      #
      #   mount: "pki"
      #   role: "gateway"

      # Google Cloud Certificate Authority Service. Authenticates through Application Default
      # Credentials, such as GKE Workload Identity. Fetch the pool's CA certificate for
      # `twingateOperator.gateway.certificateAuthority.certificate` with
      # `gcloud privateca pools get-ca-certs <caPoolId> --project <project> --location <location>`.
      # gcpPrivateCA:
      #   project: "twingate-prod"
      #   location: "us-east1"
      #   caPoolId: "gateway-ca"
      #   # Pins issuance to one CA in the pool, bypassing the pool's load balancing
      #   issuingCertificateAuthorityId: ""

# Gateway Service properties
service:
  type: ClusterIP
  # TLS port the Service exposes.
  port: 443
  # This can be used to set the LoadBalancer service type to internal only.
  # For more information checkout: https://kubernetes.io/docs/concepts/services-networking/service/#internal-load-balancer
  annotations: {}

livenessProbe:
  httpGet:
    port: https
    scheme: HTTPS
    path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 5

readinessProbe:
  httpGet:
    port: https
    scheme: HTTPS
    path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 5

containerPorts:
  https: 8443
  metrics: 9090

metrics:
  # Prometheus Pod Monitor
  # For more information checkout: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#monitoring.coreos.com/v1.PodMonitor
  podMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: ""
    relabelings: []
    metricRelabelings: []
    honorLabels: false
    additionalLabels: {}

  # Prometheus Service Monitor
  # For more information checkout: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#servicemonitor
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: ""
    relabelings: []
    metricRelabelings: []
    honorLabels: false
    additionalLabels: {}

  # Grafana Dashboard Configmap
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"

  # Custom Prometheus Rule
  # For more information checkout: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#prometheusrule
  prometheusRule:
    enabled: false
    additionalLabels: {}
    rules: []
      # # High error rate alerts
