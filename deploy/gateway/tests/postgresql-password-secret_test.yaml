suite: PostgreSQL password secret
templates:
  - postgresql-password-secret.yaml
set:
  twingate:
    network: "acme"
tests:
  - it: should not render when `postgresql.enabled` is false
    set:
      postgresql:
        enabled: false
        credentials:
          - name: "viewer"
            password: "my-password"
    asserts:
      - hasDocuments:
          count: 0
  - it: should not render when the password comes from an existing Secret
    set:
      postgresql:
        enabled: true
        credentials:
          - name: "viewer"
            passwordSecretName: "viewer-password"
    asserts:
      - hasDocuments:
          count: 0
  - it: should render a Secret for an inline password
    set:
      postgresql:
        enabled: true
        credentials:
          - name: "viewer"
            passwordSecretName: "viewer-password"
          - name: "editor"
            password: "my-password"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-postgresql-password-1
      - equal:
          path: data
          value:
            password: bXktcGFzc3dvcmQ=
  - it: should fail when an inline password is empty
    set:
      postgresql:
        enabled: true
        credentials:
          - name: "viewer"
            password: ""
    asserts:
      - failedTemplate:
          errorPattern: "postgresql\\.credentials\\[0\\]\\.password is required"
