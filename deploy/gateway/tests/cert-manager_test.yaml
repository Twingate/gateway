suite: cert-manager resources
templates:
  - cert-manager.yaml
tests:
  - it: should not render when autoGenerated is boolean true (helm engine)
    set:
      tls:
        autoGenerated: true
    asserts:
      - hasDocuments:
          count: 0
  - it: should not render when autoGenerated is boolean false
    set:
      tls:
        autoGenerated: false
    asserts:
      - hasDocuments:
          count: 0
  - it: should not render when certManager.enabled is false
    set:
      tls:
        autoGenerated:
          enabled: true
          certManager:
            enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: should not render when certManager block is omitted
    set:
      tls:
        autoGenerated:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0
  - it: should not render when existingSecret is set
    set:
      tls:
        autoGenerated:
          enabled: true
          certManager:
            enabled: true
            issuerRef:
              name: my-pki
        existingSecret: my-tls-secret
    asserts:
      - hasDocuments:
          count: 0
  - it: should error when certManager.enabled is true but issuerRef.name is empty
    set:
      tls:
        autoGenerated:
          enabled: true
          certManager:
            enabled: true
        dnsNames:
          - resource.corp.internal
    asserts:
      - failedTemplate:
          errorPattern: "tls.autoGenerated.certManager.issuerRef.name is required when tls.autoGenerated.certManager.enabled is true"
  - it: should error when the Certificate would cover no Resource address
    set:
      tls:
        autoGenerated:
          enabled: true
          certManager:
            enabled: true
            issuerRef:
              name: my-pki
    asserts:
      - failedTemplate:
          errorPattern: "would cover no Resource address"
  - it: should render the leaf Certificate referencing the configured issuer
    set:
      tls:
        autoGenerated:
          enabled: true
          certManager:
            enabled: true
            issuerRef:
              name: my-pki
              kind: ClusterIssuer
        dnsNames:
          - resource.corp.internal
    asserts:
      - matchSnapshot: {}
  - it: should render commonName when set
    set:
      tls:
        autoGenerated:
          enabled: true
          certManager:
            enabled: true
            commonName: resource.corp.internal
            issuerRef:
              name: my-pki
        dnsNames:
          - resource.corp.internal
    asserts:
      - equal:
          path: spec.commonName
          value: resource.corp.internal
  - it: should render duration and renewBefore when set
    set:
      tls:
        autoGenerated:
          enabled: true
          certManager:
            enabled: true
            duration: 2160h
            renewBefore: 360h
            issuerRef:
              name: my-pki
        dnsNames:
          - resource.corp.internal
    asserts:
      - equal:
          path: spec.duration
          value: 2160h
      - equal:
          path: spec.renewBefore
          value: 360h
  - it: should omit duration and renewBefore when unset
    set:
      tls:
        autoGenerated:
          enabled: true
          certManager:
            enabled: true
            issuerRef:
              name: my-pki
        dnsNames:
          - resource.corp.internal
    asserts:
      - notExists:
          path: spec.duration
      - notExists:
          path: spec.renewBefore
  - it: should render the configured IP addresses
    set:
      tls:
        autoGenerated:
          enabled: true
          certManager:
            enabled: true
            issuerRef:
              name: my-pki
        ipAddresses:
          - 10.0.0.1
    asserts:
      - equal:
          path: spec.ipAddresses
          value:
            - 10.0.0.1
  - it: should include the `kubernetes` Service DNS names when kubernetes.enabled is true
    set:
      kubernetes:
        enabled: true
      tls:
        autoGenerated:
          enabled: true
          certManager:
            enabled: true
            issuerRef:
              name: my-pki
    asserts:
      - equal:
          path: spec.dnsNames
          value:
            - kubernetes
            - kubernetes.default
            - kubernetes.default.svc
            - kubernetes.default.svc.cluster.local
  - it: should include the `kubernetes` Service DNS names and the resource alias when the Kubernetes resource is enabled
    set:
      twingateOperator:
        kubernetesResource:
          enabled: true
          alias: cluster.internal
      tls:
        autoGenerated:
          enabled: true
          certManager:
            enabled: true
            issuerRef:
              name: my-pki
        dnsNames:
          - resource.corp.internal
    asserts:
      - equal:
          path: spec.dnsNames
          value:
            - resource.corp.internal
            - kubernetes
            - kubernetes.default
            - kubernetes.default.svc
            - kubernetes.default.svc.cluster.local
            - cluster.internal
