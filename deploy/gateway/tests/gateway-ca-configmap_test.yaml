suite: Gateway CA configmap
templates:
  - gateway-ca-configmap.yaml
set:
  twingate:
    network: "acme"
  tls:
    certificates:
      autoGenerated:
        enabled: false
    automation:
      issuer:
        gcpPrivateCA:
          project: "twingate-prod"
          location: "us-east1"
          caPoolId: "gateway-ca"
tests:
  - it: render the CA certificate
    set:
      twingateOperator:
        gateway:
          enabled: true
          certificateAuthority:
            certificate: my-ca-cert
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-ca
      - equal:
          path: data["ca.crt"]
          value: |
            my-ca-cert
  - it: renders nothing when the operator integration is off
    set:
      twingateOperator:
        gateway:
          enabled: false
          certificateAuthority:
            certificate: my-ca-cert
    asserts:
      - hasDocuments:
          count: 0
  - it: renders nothing when the CA certificate lives in a ConfigMap the user manages
    set:
      twingateOperator:
        gateway:
          enabled: true
          certificateAuthority:
            certificateConfigMapName: issuer-ca
    asserts:
      - hasDocuments:
          count: 0
  - it: renders nothing when a certificate accompanies an existing ConfigMap
    set:
      twingateOperator:
        gateway:
          enabled: true
          certificateAuthority:
            name: my-ca
            certificate: "-----BEGIN CERTIFICATE-----"
            certificateConfigMapName: issuer-ca
    asserts:
      - hasDocuments:
          count: 0
