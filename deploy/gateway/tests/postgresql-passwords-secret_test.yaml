suite: PostgreSQL passwords secret
templates:
  - postgresql-passwords-secret.yaml
tests:
  - it: should not render when postgresql is disabled
    set:
      postgresql:
        enabled: false
    asserts:
      - notExists:
          path: kind

  - it: should not render when postgresql is enabled but no credentials are configured
    set:
      postgresql:
        enabled: true
        credentials: []
    asserts:
      - notExists:
          path: kind

  - it: should render a Secret with one entry per credential
    set:
      postgresql:
        enabled: true
        credentials:
          - name: "Prod Viewer"
            password: "s3cret"
          - name: "prod-editor"
            password: "another-secret"
    asserts:
      - equal:
          path: kind
          value: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-postgresql-passwords
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data.prod-viewer
          value: czNjcmV0
      - equal:
          path: data.prod-editor
          value: YW5vdGhlci1zZWNyZXQ=

  - it: should fail when a credential is missing its password
    set:
      postgresql:
        enabled: true
        credentials:
          - name: "prod-viewer"
    asserts:
      - failedTemplate:
          errorPattern: "password is required"
