suite: TLS Vault issuer CA bundle ConfigMap
templates:
  - tls-vault-issuer-ca-bundle-configmap.yaml
set:
  tls:
    certificates:
      autoGenerated:
        enabled: false
    automation:
      enabled: true
      issuer:
        vault:
          address: "https://vault.acme.int:8200"
          role: "my-role"
tests:
  - it: should not render when automation is disabled
    set:
      tls:
        automation:
          enabled: false
          issuer:
            vault:
              caBundle: "ca-cert"
    asserts:
      # Empty document
      - notExists:
          path: kind
  - it: should not render when using an existing CA bundle ConfigMap
    set:
      tls:
        automation:
          issuer:
            vault:
              caBundle: "ca-cert"
              caBundleConfigMapName: "my-existing-configmap"
    asserts:
      # Empty document
      - notExists:
          path: kind
  - it: should not render when the CA bundle is not specified
    set:
      tls:
        automation:
          issuer:
            vault:
              caBundle: ""
    asserts:
      # Empty document
      - notExists:
          path: kind
  - it: should render a ConfigMap when the CA bundle is specified
    set:
      tls:
        automation:
          issuer:
            vault:
              caBundle: "ca-cert"
    asserts:
      - equal:
          path: kind
          value: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-tls-vault-issuer-ca-bundle
      - equal:
          path: data["ca.crt"]
          value: |
            ca-cert
