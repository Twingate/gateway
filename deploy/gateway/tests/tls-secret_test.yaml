suite: TLS secret
templates:
  - tls-secret.yaml
tests:
  - it: should not render when certManager.enabled is true
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: true
            certManager:
              enabled: true
              issuerRef:
                name: my-pki
    asserts:
      # Empty document
      - notExists:
          path: kind
  - it: should fail when no certificate is configured
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "The Gateway needs at least one certificate"
  - it: should render an inline `secrets` entry after the auto-generated certificate
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: true
            dnsNames:
              - resource.corp.internal
          secrets:
            - name: my-tls-secret # An existing secret is ignored
            - cert: "my-tls-cert"
              key: "my-tls-key"
              ca: "my-ca-cert"
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-tls
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-tls-1
        documentIndex: 1
      - equal:
          path: data
          value:
            tls.crt: bXktdGxzLWNlcnQ=
            tls.key: bXktdGxzLWtleQ==
            ca.crt: bXktY2EtY2VydA==
        documentIndex: 1
  - it: should fail when a `secrets` entry has an empty name
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
          secrets:
            - name: ""
    asserts:
      - failedTemplate:
          errorPattern: "at '/tls/certificates/secrets/0/name': minLength"
  - it: should fail when a `secrets` entry has no certificate
    set:
      tls:
        certificates:
          secrets:
            - cert: "my-tls-cert"
    asserts:
      - failedTemplate:
          errorPattern: "at '/tls/certificates/secrets/0'"
  - it: should fail when a `secrets` entry names a secret and inlines one
    set:
      tls:
        certificates:
          secrets:
            - name: my-tls-secret
              cert: "my-tls-cert"
              key: "my-tls-key"
              ca: "my-ca-cert"
    asserts:
      - failedTemplate:
          errorPattern: "at '/tls/certificates/secrets/0'"
  - it: should fail when an inline `secrets` entry has an empty certificate
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
          secrets:
            - cert: ""
              key: "my-tls-key"
              ca: "my-ca-cert"
    asserts:
      - failedTemplate:
          errorPattern: "tls\\.certificates\\.secrets\\[0\\]\\.cert is required"
  - it: should fail when an inline `secrets` entry has an empty key
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
          secrets:
            - cert: "my-tls-cert"
              key: ""
              ca: "my-ca-cert"
    asserts:
      - failedTemplate:
          errorPattern: "tls\\.certificates\\.secrets\\[0\\]\\.key is required"
  - it: should fail when an inline `secrets` entry has an empty CA
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
          secrets:
            - cert: "my-tls-cert"
              key: "my-tls-key"
              ca: ""
    asserts:
      - failedTemplate:
          errorPattern: "tls\\.certificates\\.secrets\\[0\\]\\.ca is required"
  - it: should fail when the certificate would cover no Resource address
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "would cover no Resource address"
  - it: should fail when a DNS name is empty
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: true
            dnsNames: [""]
    asserts:
      - failedTemplate:
          errorPattern: "at '/tls/certificates/autoGenerated/dnsNames/0': minLength: got 0, want 1"
  - it: should fail when an IP address is empty
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: true
            ipAddresses: [""]
    asserts:
      - failedTemplate:
          errorPattern: "at '/tls/certificates/autoGenerated/ipAddresses/0': minLength: got 0, want 1"
  - it: should generate TLS and CA certificates when `autoGenerated` is enabled
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: true
            dnsNames:
              - resource.corp.internal
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-tls
      - matchRegex:
          path: "data['tls.crt']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
      - matchRegex:
          path: "data['tls.key']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
      - matchRegex:
          path: "data['ca.crt']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
  - it: should not re-generate certificates when the alternative names have not changed
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: true
            dnsNames:
              - resource.corp.internal
    kubernetesProvider:
      # Mock previously generated secret
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          type: kubernetes.io/tls
          metadata:
            name: RELEASE-NAME-gateway-tls
            namespace: NAMESPACE
            annotations:
              # sha256 hash of "[]-[\"resource.corp.internal\"]"
              checksum/alternativeNames: ea586d90c96d87827b4fdcd8845095ee153daa2c4c6f4bd2b826f28205422986
          data:
            tls.crt: generated-cert
            tls.key: generated-key
            ca.crt: generated-ca
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-tls
      - equal:
          path: metadata.annotations
          value:
            # sha256 hash of "[]-[\"resource.corp.internal\"]"
            checksum/alternativeNames: ea586d90c96d87827b4fdcd8845095ee153daa2c4c6f4bd2b826f28205422986
      - equal:
          path: data
          value:
            tls.crt: generated-cert
            tls.key: generated-key
            ca.crt: generated-ca
  - it: should re-generate certificates when the DNS names have changed
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: true
            dnsNames:
              - other.corp.internal
    kubernetesProvider:
      # Mock previously generated secret
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          type: kubernetes.io/tls
          metadata:
            name: RELEASE-NAME-gateway-tls
            namespace: NAMESPACE
            annotations:
              # sha256 hash of "[]-[\"resource.corp.internal\"]"
              checksum/alternativeNames: ea586d90c96d87827b4fdcd8845095ee153daa2c4c6f4bd2b826f28205422986
          data:
            tls.crt: generated-cert
            tls.key: generated-key
            ca.crt: generated-ca
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-tls
      - equal:
          path: metadata.annotations
          value:
            # sha256 hash of "[]-[\"other.corp.internal\"]"
            checksum/alternativeNames: 30456286e51cc0a5140eb4645fcf6f0656efa65734d0508c6e01ae16e621e9a2
      - matchRegex:
          path: "data['tls.crt']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
      - matchRegex:
          path: "data['tls.key']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
      - matchRegex:
          path: "data['ca.crt']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
  - it: should re-generate certificates when the resource alias has changed
    set:
      twingateOperator:
        kubernetesResource:
          enabled: true
          alias: new-alias.int
      tls:
        certificates:
          autoGenerated:
            enabled: true
    kubernetesProvider:
      # Mock previously generated secret
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          type: kubernetes.io/tls
          metadata:
            name: RELEASE-NAME-gateway-tls
            namespace: NAMESPACE
            annotations:
              # sha256 hash of "[]-[<the kubernetes Service DNS names>,\"old-alias.int\"]"
              checksum/alternativeNames: 768f4b4b2dbac90c8fbce4a8e12b3b26fde44cf23091574f367a0250db75eb18
          data:
            tls.crt: generated-cert
            tls.key: generated-key
            ca.crt: generated-ca
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-tls
      - equal:
          path: metadata.annotations
          value:
            # sha256 hash of "[]-[<the kubernetes Service DNS names>,\"new-alias.int\"]"
            checksum/alternativeNames: 6b51ae269bd5d76c462253104e93b5bacf620007196cfd8df4b4701bbfb46726
      - matchRegex:
          path: "data['tls.crt']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
      - matchRegex:
          path: "data['tls.key']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
      - matchRegex:
          path: "data['ca.crt']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
  - it: should render nothing when automation is the only certificate source
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
        automation:
          issuer:
            gcpPrivateCA:
              project: "twingate-prod"
              location: "us-east1"
              caPoolId: "gateway-ca"
    asserts:
      - hasDocuments:
          count: 0
