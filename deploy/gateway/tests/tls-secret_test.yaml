suite: TLS secret
templates:
  - tls-secret.yaml
set:
  tls:
    cert: "my-tls-cert"
    key: "my-tls-key"
    ca: "my-ca-cert"
tests:
  - it: should not render when `existingSecret` is provided
    set:
      tls:
        existingSecret: "my-tls-secret"
    asserts:
      # Empty document
      - notExists:
          path: kind
  - it: should not render when certManager.enabled is true
    set:
      tls:
        autoGenerated:
          enabled: true
          certManager:
            enabled: true
            issuerRef:
              name: my-pki
    asserts:
      - notExists:
          path: kind
  - it: should fail when the certificate would cover no Resource address
    set:
      tls:
        autoGenerated:
          enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "would cover no Resource address"
  - it: should use provided certificates when autoGenerated is an object with enabled false
    set:
      tls:
        autoGenerated:
          enabled: false
    asserts:
      - equal:
          path: data
          value:
            tls.crt: bXktdGxzLWNlcnQ=
            tls.key: bXktdGxzLWtleQ==
            ca.crt: bXktY2EtY2VydA==
  - it: should use provided certificates when `autoGenerated` is false
    set:
      tls:
        autoGenerated: false
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-tls
      - equal:
          path: data
          value:
            tls.crt: bXktdGxzLWNlcnQ=
            tls.key: bXktdGxzLWtleQ==
            ca.crt: bXktY2EtY2VydA==
  - it: should generate TLS and CA certificates when `autoGenerated` is true
    set:
      tls:
        autoGenerated: true
        dnsNames:
          - resource.corp.internal
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-tls
      - matchRegex:
          path: "data['tls.crt']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
      - matchRegex:
          path: "data['tls.key']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
      - matchRegex:
          path: "data['ca.crt']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
  - it: should not re-generate certificates when the alternative names have not changed
    set:
      tls:
        autoGenerated:
          enabled: true
        dnsNames:
          - resource.corp.internal
    kubernetesProvider:
      # Mock previously generated secret
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          type: kubernetes.io/tls
          metadata:
            name: RELEASE-NAME-gateway-tls
            namespace: NAMESPACE
            annotations:
              # sha256 hash of "[]-[\"resource.corp.internal\"]"
              checksum/alternativeNames: ea586d90c96d87827b4fdcd8845095ee153daa2c4c6f4bd2b826f28205422986
          data:
            tls.crt: generated-cert
            tls.key: generated-key
            ca.crt: generated-ca
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-tls
      - equal:
          path: metadata.annotations
          value:
            # sha256 hash of "[]-[\"resource.corp.internal\"]"
            checksum/alternativeNames: ea586d90c96d87827b4fdcd8845095ee153daa2c4c6f4bd2b826f28205422986
      - equal:
          path: data
          value:
            tls.crt: generated-cert
            tls.key: generated-key
            ca.crt: generated-ca
  - it: should re-generate certificates when the DNS names have changed
    set:
      tls:
        autoGenerated:
          enabled: true
        dnsNames:
          - other.corp.internal
    kubernetesProvider:
      # Mock previously generated secret
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          type: kubernetes.io/tls
          metadata:
            name: RELEASE-NAME-gateway-tls
            namespace: NAMESPACE
            annotations:
              # sha256 hash of "[]-[\"resource.corp.internal\"]"
              checksum/alternativeNames: ea586d90c96d87827b4fdcd8845095ee153daa2c4c6f4bd2b826f28205422986
          data:
            tls.crt: generated-cert
            tls.key: generated-key
            ca.crt: generated-ca
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-tls
      - equal:
          path: metadata.annotations
          value:
            # sha256 hash of "[]-[\"other.corp.internal\"]"
            checksum/alternativeNames: 30456286e51cc0a5140eb4645fcf6f0656efa65734d0508c6e01ae16e621e9a2
      - matchRegex:
          path: "data['tls.crt']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
      - matchRegex:
          path: "data['tls.key']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
      - matchRegex:
          path: "data['ca.crt']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
  - it: should re-generate certificates when the resource alias has changed
    set:
      twingateOperator:
        kubernetesResource:
          enabled: true
          alias: new-alias.int
      tls:
        autoGenerated:
          enabled: true
    kubernetesProvider:
      # Mock previously generated secret
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          type: kubernetes.io/tls
          metadata:
            name: RELEASE-NAME-gateway-tls
            namespace: NAMESPACE
            annotations:
              # sha256 hash of "[]-[<the kubernetes Service DNS names>,\"old-alias.int\"]"
              checksum/alternativeNames: 768f4b4b2dbac90c8fbce4a8e12b3b26fde44cf23091574f367a0250db75eb18
          data:
            tls.crt: generated-cert
            tls.key: generated-key
            ca.crt: generated-ca
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-tls
      - equal:
          path: metadata.annotations
          value:
            # sha256 hash of "[]-[<the kubernetes Service DNS names>,\"new-alias.int\"]"
            checksum/alternativeNames: 6b51ae269bd5d76c462253104e93b5bacf620007196cfd8df4b4701bbfb46726
      - matchRegex:
          path: "data['tls.crt']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
      - matchRegex:
          path: "data['tls.key']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
      - matchRegex:
          path: "data['ca.crt']"
          pattern: "^([A-Za-z0-9+/=]{20,})$"
