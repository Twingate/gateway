suite: NOTES
templates:
  - NOTES.txt
tests:
  - it: should show ClusterIP instructions when service type is ClusterIP
    set:
      tls: &staticCertificate
        certificates:
          autoGenerated:
            enabled: false
          secrets:
            - cert: "my-tls-cert"
              key: "my-tls-key"
              ca: "my-ca-cert"
      service:
        type: ClusterIP
    asserts:
      - matchSnapshot: {}
  - it: should show LoadBalancer instructions when service type is LoadBalancer
    set:
      tls: *staticCertificate
      service:
        type: LoadBalancer
    asserts:
      - matchSnapshot: {}
  - it: should show auto-generated CA on first run
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "-----END CERTIFICATE-----\n\n$"
  - it: should show auto-generated CA when secrets are also provided
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: true
          secrets:
            - cert: "my-tls-cert"
              key: "my-tls-key"
              ca: "my-ca-cert"
    asserts:
      - matchRegexRaw:
          pattern: "-----END CERTIFICATE-----\n\n$"
  - it: should show the CA of the first provided `secrets` entry when `autoGenerated` is disabled
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
          secrets:
            - cert: "my-tls-cert"
              key: "my-tls-key"
              ca: "my-ca-cert"
            - cert: "other-tls-cert"
              key: "other-tls-key"
              ca: "other-ca-cert"
    asserts:
      - matchRegexRaw:
          pattern: 'from the "RELEASE-NAME-gateway-tls-0" Secret'
      - matchRegexRaw:
          pattern: "my-ca-cert"
  - it: should show the rotated inline `secrets` CA rather than the one already in the cluster
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
          secrets:
            - cert: "my-tls-cert"
              key: "my-tls-key"
              ca: "rotated-ca-cert"
    kubernetesProvider:
      # Mock the Secret a previous release applied, holding the superseded CA
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          type: kubernetes.io/tls
          metadata:
            name: RELEASE-NAME-gateway-tls-0
            namespace: NAMESPACE
          data:
            ca.crt: "c3RhbGUtY2EtY2VydAo="
    asserts:
      - matchRegexRaw:
          pattern: "rotated-ca-cert"
      - notMatchRegexRaw:
          pattern: "stale-ca-cert"
  - it: should show the CA of the first existing `secrets` entry when `autoGenerated` is disabled
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
          secrets:
            - name: my-tls-secret
            - name: other-tls-secret
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          type: kubernetes.io/tls
          metadata:
            name: my-tls-secret
            namespace: NAMESPACE
          data:
            ca.crt: "bXktY2EtY2VydAo="
        - kind: Secret
          apiVersion: v1
          type: kubernetes.io/tls
          metadata:
            name: other-tls-secret
            namespace: NAMESPACE
          data:
            ca.crt: "b3RoZXItY2EtY2VydAo="
    asserts:
      - matchRegexRaw:
          pattern: 'from the "my-tls-secret" Secret'
      - matchRegexRaw:
          pattern: "my-ca-cert"
  - it: should show cert-manager kubectl instructions when certManager.enabled is true
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: true
            certManager:
              enabled: true
              issuerRef:
                name: my-pki
    asserts:
      - matchRegexRaw:
          pattern: "cert-manager is provisioning the certificate"
      - matchRegexRaw:
          pattern: "kubectl get secret --namespace NAMESPACE RELEASE-NAME-gateway-tls"
      - matchRegexRaw:
          pattern: "cert-manager does not delete this Secret"
  - it: should show previously generated CA when the alternative names have not changed
    set:
      kubernetes:
        enabled: true
      tls:
        certificates:
          autoGenerated:
            enabled: true
    kubernetesProvider:
      # Mock previously generated secret
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          type: kubernetes.io/tls
          metadata:
            name: RELEASE-NAME-gateway-tls
            namespace: NAMESPACE
            annotations:
              # sha256 hash of "[]-[<the four kubernetes Service DNS names>]"
              checksum/alternativeNames: 66b946cb0a7f425627351aad1df5936ee2e9ee2fc2547336ea2db75fc1661d02
          data:
            ca.crt: ""
    asserts:
      - matchSnapshot: {}
  - it: should show new generated CA when the alternative names have changed
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: true
            dnsNames:
              - my-cluster.int
    kubernetesProvider:
      # Mock previously generated secret
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          type: kubernetes.io/tls
          metadata:
            name: RELEASE-NAME-gateway-tls
            namespace: NAMESPACE
            annotations:
              # sha256 hash of "[]-[<the four kubernetes Service DNS names>]"
              checksum/alternativeNames: 66b946cb0a7f425627351aad1df5936ee2e9ee2fc2547336ea2db75fc1661d02
          data:
            ca.crt: ""
    asserts:
      - notMatchRegexRaw:
          # The regex matches the content of the existing CA cert in `data/ca.crt`, with `+` characters being escaped.
          pattern: |-
            -----BEGIN CERTIFICATE-----
            MIIDIDCCAgigAwIBAgIRANR3YBydhgMaFH4HzGiKyOEwDQYJKoZIhvcNAQELBQAw
            GjEYMBYGA1UEAxMPcHAtcGFtLXByb3h5LWNhMB4XDTI1MDQyMTE2NDY1NFoXDTI2
            MDQyMTE2NDY1NFowGjEYMBYGA1UEAxMPcHAtcGFtLXByb3h5LWNhMIIBIjANBgkq
            hkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA96wp/MyDujuM/bNLChJ06F5irGUBKfBY
            yR17uGnpYW6PqiAB6gbn1O1pb5p4ey6w6HfSY6YzVnkq4JzWH3y5KnHsL3EuAh3m
            heqX2nRk0HPQM3oCnS4AUxz2DEaug2u45tcmoDVnRx45VfeVEvDz9gT0Tr9qJNUO
            p1Tb0\+bKFVdoOTXTiJKcpMBLXKzslkr1R6\+dEhpgb0RtEBfb7E6530Bx4oBbYj31
            sfTlLiHrGvwpOFiv5rjBzOjeyF4XU4yFAwvHKPpJ\+VBq9iECVyOCKUv4HQV1x6xS
            twKG\+bRWlsxPgS/5esu2SD3p6yNKL/vIod6gV2u8DTiR25gHyCEDYQIDAQABo2Ew
            XzAOBgNVHQ8BAf8EBAMCAqQwHQYDVR0lBBYwFAYIKwYBBQUHAwEGCCsGAQUFBwMC
            MA8GA1UdEwEB/wQFMAMBAf8wHQYDVR0OBBYEFMu6hvsUoH9UmB5q4qbC46q3LdLu
            MA0GCSqGSIb3DQEBCwUAA4IBAQAgv32hCwyOHS9veQlV7/z7SwhIKCtNbpgVAnmR
            CP7iDlmMOf379KqxWey\+/utxaAT6sjIhiNmrFwHNoUWjj9Bv6U0oWC1XDxzpfABT
            IfHtpLuH3xLa98S6F8Ez2TZp6Hyd7/pxQImBIwIgenOrAy6cuRSRjQtXYq3o/0Wx
            M8C/gZSvCg5622coUWHnuaVdn/3bJ/P/IkmYmX2sN66BR3i70BO/kxeGlQMlqiqI
            fLRk3a/Kh/4vpIdcfI38Xb\+iwfjRvCVEQAkf8efDzIfzL8yj5Mk\+E5OsfMD80YuZ
            khGd00QOCDRCpVisdRQmbzFv6JkeYKxhWzaulPHgl1JRzWaI
            -----END CERTIFICATE-----\n\n$
  - it: should show instruction to register the CA certificate when only automation is configured without Operator
    set:
      tls: &automationOnly
        certificates:
          autoGenerated:
            enabled: false
        automation:
          enabled: true
          issuer:
            gcpPrivateCA:
              project: "twingate-prod"
              location: "us-east1"
              caPoolId: "gateway-ca"
    asserts:
      - matchRegexRaw:
          pattern: "Register the issuer's CA certificate with Twingate"
      - matchRegexRaw:
          pattern: "gcloud privateca pools get-ca-certs gateway-ca --project twingate-prod --location us-east1"
  - it: should show the local issuer certificate
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
        automation:
          enabled: true
          issuer:
            local:
              certificate: "my-ca-cert"
              privateKey: "my-ca-key"
    asserts:
      - matchRegexRaw:
          pattern: 'from the "RELEASE-NAME-gateway-tls-local-issuer" Secret. The CA certificate is\n\nmy-ca-cert'
  - it: should show the certificate from an existing local issuer Secret
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
        automation:
          enabled: true
          issuer:
            local:
              secretName: my-existing-secret
              certificate: "supplied-ca-cert" # Ignore inline keypair when a Secret is specified
              privateKey: "supplied-ca-key"
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      # Mock the existing Secret holding the issuer's certificate
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: my-existing-secret
            namespace: NAMESPACE
          data:
            # base64 of "issuer-ca-cert"
            ca.crt: "aXNzdWVyLWNhLWNlcnQ="
    asserts:
      - matchRegexRaw:
          pattern: 'from the "my-existing-secret" Secret. The CA certificate is\n\nissuer-ca-cert'
      - notMatchRegexRaw:
          pattern: "supplied-ca-cert"
  - it: should show the rotated local issuer certificate rather than the one already in the cluster
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
        automation:
          enabled: true
          issuer:
            local:
              certificate: "rotated-ca-cert"
              privateKey: "my-ca-key"
    kubernetesProvider:
      # Mock the Secret a previous release applied, holding the superseded CA
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: RELEASE-NAME-gateway-tls-local-issuer
            namespace: NAMESPACE
          data:
            # base64 of "stale-ca-cert"
            ca.crt: "c3RhbGUtY2EtY2VydA=="
    asserts:
      - matchRegexRaw:
          pattern: "rotated-ca-cert"
      - notMatchRegexRaw:
          pattern: "stale-ca-cert"
  - it: should show the provided CA certificate
    set:
      tls: *automationOnly
      twingateOperator:
        gateway:
          enabled: true
          certificateAuthority:
            name: my-ca
            certificate: my-ca-cert
    asserts:
      - matchRegexRaw:
          pattern: "The CA certificate is\n\nmy-ca-cert"
  - it: should show the existing CA certificate Secret
    set:
      tls: *automationOnly
      twingateOperator:
        gateway:
          enabled: true
          certificateAuthority:
            name: my-ca
            certificateSecretName: issuer-ca
    kubernetesProvider: &caSecretProvider
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      # Mock the existing Secret
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: issuer-ca
            namespace: NAMESPACE
          data:
            ca.crt: "aXNzdWVyLWNhLWNlcnQ="
    asserts:
      - matchRegexRaw:
          pattern: "from the \"issuer-ca\" Secret. The CA certificate is\n\nissuer-ca-cert"
  - it: should show the existing Secret CA certificate rather than the provided one
    set:
      tls: *automationOnly
      twingateOperator:
        gateway:
          enabled: true
          certificateAuthority:
            name: my-ca
            certificate: supplied-ca-cert # Ignore inline certificate when name is specified
            certificateSecretName: issuer-ca
    kubernetesProvider:
      <<: *caSecretProvider
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: issuer-ca
            namespace: NAMESPACE
          data:
            ca.crt: "aXNzdWVyLWNhLWNlcnQ="
    asserts:
      - matchRegexRaw:
          pattern: "from the \"issuer-ca\" Secret. The CA certificate is\n\nissuer-ca-cert"
      - notMatchRegexRaw:
          pattern: "supplied-ca-cert"
  - it: should show the rotated CA certificate rather than the one already in the cluster
    set:
      tls: *staticCertificate
      twingateOperator:
        gateway:
          enabled: true
          certificateAuthority:
            name: my-ca
            certificate: rotated-ca-cert
    kubernetesProvider:
      <<: *caSecretProvider
      # Mock the Secret a previous release applied
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: RELEASE-NAME-gateway-ca
            namespace: NAMESPACE
          data:
            ca.crt: "c3RhbGUtY2EtY2VydA=="
    asserts:
      - matchRegexRaw:
          pattern: "rotated-ca-cert"
      - notMatchRegexRaw:
          pattern: "stale-ca-cert"
  - it: should show the provided CA certificate instead of the one from TLS secret when operator is enabled
    set:
      twingateOperator:
        gateway:
          enabled: true
          certificateAuthority:
            name: my-ca
            certificate: my-ca-cert
      tls: *staticCertificate
    asserts:
      - matchRegexRaw:
          pattern: "from the \"RELEASE-NAME-gateway-ca\" Secret. The CA certificate is\n\nmy-ca-cert"
  - it: should show CA certificate from TLS secret when the operator is disabled
    set:
      tls: *staticCertificate
      twingateOperator:
        gateway:
          enabled: false
          certificateAuthority:
            certificate: my-ca-cert
    asserts:
      - matchRegexRaw:
          pattern: 'from the "RELEASE-NAME-gateway-tls-0" Secret'
      - notMatchRegexRaw:
          pattern: "RELEASE-NAME-gateway-ca"
