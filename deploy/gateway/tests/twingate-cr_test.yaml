suite: Twingate Custom Resources
templates:
  - twingate-cr.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0
  - it: fails when kubernetesResource is enabled but gateway is not
    set:
      twingateOperator:
        kubernetesResource:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: twingateOperator.kubernetesResource.enabled=true requires twingateOperator.gateway.enabled=true
  - it: fails when the in-cluster resource sets its own remote network, even to an empty value
    set:
      twingateOperator:
        gateway:
          enabled: true
        kubernetesResource:
          enabled: true
          remoteNetworkId: ""
    asserts:
      - failedTemplate:
          errorMessage: twingateOperator.kubernetesResource.remoteNetworkId is not supported, set twingateOperator.remoteNetworkId instead
  - it: renders the CA and Gateway when gateway is enabled
    set:
      twingateOperator:
        gateway:
          enabled: true
    kubernetesProvider: &clusterNamespace
      scheme:
        "v1/Namespace":
          gvr:
            version: "v1"
            resource: "namespaces"
          namespaced: false
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata:
            name: kube-system
            uid: 11111111-2222-3333-4444-555555555555
    asserts:
      - matchSnapshot: {}
  - it: renders the in-cluster Kubernetes resource when enabled
    set:
      twingateOperator:
        gateway:
          enabled: true
        kubernetesResource:
          enabled: true
          name: "My cluster"
          alias: cluster.int
          securityPolicyId: "U2VjdXJpdHlQb2xpY3k6MTIz"
    kubernetesProvider: *clusterNamespace
    asserts:
      - matchSnapshot: {}
  - it: defaults the resource name when none is provided
    set:
      twingateOperator:
        gateway:
          enabled: true
        kubernetesResource:
          enabled: true
    kubernetesProvider: *clusterNamespace
    documentSelector:
      path: kind
      value: TwingateResource
    asserts:
      - equal:
          path: spec.name
          value: "RELEASE-NAME-gateway Kubernetes cluster"
  - it: omits remoteNetworkId when none is set, leaving the operator's default
    set:
      twingateOperator:
        gateway:
          enabled: true
        kubernetesResource:
          enabled: true
    kubernetesProvider: *clusterNamespace
    asserts:
      - notExists:
          path: spec.remoteNetworkId
  - it: sets remoteNetworkId on the gateway
    set:
      twingateOperator:
        remoteNetworkId: "UmVtb3RlTmV0d29yazoxMjMK"
        gateway:
          enabled: true
    kubernetesProvider: *clusterNamespace
    documentSelector:
      path: kind
      value: TwingateGateway
    asserts:
      - equal:
          path: spec.remoteNetworkId
          value: "UmVtb3RlTmV0d29yazoxMjMK"
  - it: sets the same remoteNetworkId on the in-cluster resource
    set:
      twingateOperator:
        remoteNetworkId: "UmVtb3RlTmV0d29yazoxMjMK"
        gateway:
          enabled: true
        kubernetesResource:
          enabled: true
    kubernetesProvider: *clusterNamespace
    documentSelector:
      path: kind
      value: TwingateResource
    asserts:
      - equal:
          path: spec.remoteNetworkId
          value: "UmVtb3RlTmV0d29yazoxMjMK"
  - it: suffixes the CA name with a hash of the cluster and namespace
    set:
      twingateOperator:
        gateway:
          enabled: true
    kubernetesProvider: *clusterNamespace
    documentSelector:
      path: kind
      value: TwingateCertificateAuthority
    asserts:
      - equal:
          path: spec.name
          # first 16 chars of sha256("11111111-2222-3333-4444-555555555555/NAMESPACE")
          value: RELEASE-NAME-gateway-ca-ae3f578ff6303ac5
  - it: uses the CA name when provided, without reading the cluster
    set:
      twingateOperator:
        gateway:
          enabled: true
          certificateAuthority:
            name: "acme prod cluster CA"
    documentSelector:
      path: kind
      value: TwingateCertificateAuthority
    asserts:
      - equal:
          path: spec.name
          value: "acme prod cluster CA"
  - it: fails when the cluster cannot be read and no CA name is set
    set:
      twingateOperator:
        gateway:
          enabled: true
    asserts:
      - failedTemplate:
          errorPattern: Set twingateOperator.gateway.certificateAuthority.name to a name unique within your Twingate network
