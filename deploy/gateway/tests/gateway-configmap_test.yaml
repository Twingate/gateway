suite: Gateway configmap with TLS automation
templates:
  - gateway-configmap.yaml
set:
  twingate:
    network: "acme"
tests:
  - it: should render automation block
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
        automation:
          enabled: true
          certificate:
            ttl: "24h"
            key:
              type: "ecdsa"
              bits: 256
          issuer:
            gcpPrivateCA:
              project: "twingate-prod"
              location: "us-east1"
              caPoolId: "gateway-ca"
    asserts:
      - equal:
          path: data["config.yaml"]
          value: |-
            twingate:
              network: "acme"
              host: "twingate.com"

            port: 8443
            metricsPort: 9090

            auditLog:
              flushInterval: 5m
              flushSizeThreshold: 1e+06

            tls:
              automation:
                certificate:
                  ttl: "24h"
                  key:
                    type: "ecdsa"
                    bits: 256
                issuer:
                  gcpPrivateCA:
                    project: "twingate-prod"
                    location: "us-east1"
                    caPoolID: "gateway-ca"
  - it: should fail on an unsupported key type
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
        automation:
          enabled: true
          certificate:
            key:
              type: "ed25519"
          issuer:
            gcpPrivateCA:
              project: "twingate-prod"
              location: "us-east1"
              caPoolId: "gateway-ca"
    asserts:
      - failedTemplate:
          errorPattern: "at '/tls/automation/certificate/key/type': value must be one of 'ecdsa', 'rsa'"
  - it: should render no automation block when disabled
    set:
      tls:
        automation:
          enabled: false
          issuer:
            gcpPrivateCA:
              project: "twingate-prod"
              location: "us-east1"
              caPoolId: "gateway-ca"
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "automation:"
  - it: should fail when enabled without an issuer
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
        automation:
          enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "at '/tls/automation/issuer': 'oneOf' failed, none matched"
  - it: should fail on an unknown issuer
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
        automation:
          enabled: true
          issuer:
            invalid:
              name: "garbage"
    asserts:
      - failedTemplate:
          errorPattern: "at '/tls/automation/issuer': additional properties 'invalid' not allowed"
---
suite: Gateway configmap with GCP Private CA TLS automation
templates:
  - gateway-configmap.yaml
set:
  twingate:
    network: "acme"
tests:
  - it: should render
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
        automation:
          enabled: true
          issuer:
            gcpPrivateCA:
              project: "twingate-prod"
              location: "us-east1"
              caPoolId: "gateway-ca"
              issuingCertificateAuthorityId: "gateway-ca-1"
    asserts:
      - equal:
          path: data["config.yaml"]
          value: |-
            twingate:
              network: "acme"
              host: "twingate.com"

            port: 8443
            metricsPort: 9090

            auditLog:
              flushInterval: 5m
              flushSizeThreshold: 1e+06

            tls:
              automation:
                certificate:
                  ttl: "24h"
                  key:
                    type: "ecdsa"
                issuer:
                  gcpPrivateCA:
                    project: "twingate-prod"
                    location: "us-east1"
                    caPoolID: "gateway-ca"
                    issuingCertificateAuthorityID: "gateway-ca-1"
  - it: should fail when project is empty
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
        automation:
          enabled: true
          issuer:
            gcpPrivateCA:
              project: ""
              location: "us-east1"
              caPoolId: "gateway-ca"
    asserts:
      - failedTemplate:
          errorMessage: tls.automation.issuer.gcpPrivateCA.project is required
  - it: should fail when location is empty
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
        automation:
          enabled: true
          issuer:
            gcpPrivateCA:
              project: "twingate-prod"
              location: ""
              caPoolId: "gateway-ca"
    asserts:
      - failedTemplate:
          errorMessage: tls.automation.issuer.gcpPrivateCA.location is required
  - it: should fail when CA pool is empty
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
        automation:
          enabled: true
          issuer:
            gcpPrivateCA:
              project: "twingate-prod"
              location: "us-east1"
              caPoolId: ""
    asserts:
      - failedTemplate:
          errorMessage: tls.automation.issuer.gcpPrivateCA.caPoolId is required
  - it: should fail when the required fields are missing
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
        automation:
          enabled: true
          issuer:
            gcpPrivateCA: {}
    asserts:
      - failedTemplate:
          errorPattern: "at '/tls/automation/issuer/gcpPrivateCA': missing properties 'project', 'location', 'caPoolId'"
