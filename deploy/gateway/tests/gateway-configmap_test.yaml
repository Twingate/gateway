suite: Gateway configmap with SSH
templates:
  - gateway-configmap.yaml
set:
  twingate:
    network: "acme"
  ssh:
    enabled: true
    gateway:
      username: "gateway"
tests:
  - it: should include SSH with manual CA
    set:
      ssh:
        ca:
          manual:
            privateKey: "my-private-key"
    asserts:
      - equal:
          path: data["config.yaml"]
          value: |-
            twingate:
              network: "acme"
              host: "twingate.com"

            port: 8443
            metricsPort: 9090

            auditLog:
              flushInterval: 5m
              flushSizeThreshold: 1e+06

            tls:
              certificates:
                files:
                  - certificateFile: "/etc/gateway/tls/0/tls.crt"
                    privateKeyFile: "/etc/gateway/tls/0/tls.key"

            ssh:
              gateway:
                username: "gateway"
                key:
                  type: "ed25519"
                hostCertificate:
                  ttl: "24h"
                userCertificate:
                  ttl: "5m"

              ca:
                manual:
                  privateKeyFile: "/etc/gateway/ssh/ca-private-key"
  - it: should include SSH with Vault CA
    set:
      ssh:
        ca:
          vault:
            address: "https://vault.example.com:8200"
            caBundle: "ca-cert"
            namespace: "test-namespace"
            auth:
              token: "test-token"

            mount: "ssh-gateway"
            role: "gateway"

            gatewayHostCA:
              mount: "ssh-gateway-host"
              role: "gateway-host"

            gatewayUserCA:
              mount: "ssh-gateway-user"
              role: "gateway-user"

            upstreamHostCA:
              mount: "ssh-upstream-host"
    asserts:
      - equal:
          path: data["config.yaml"]
          value: |-
            twingate:
              network: "acme"
              host: "twingate.com"

            port: 8443
            metricsPort: 9090

            auditLog:
              flushInterval: 5m
              flushSizeThreshold: 1e+06

            tls:
              certificates:
                files:
                  - certificateFile: "/etc/gateway/tls/0/tls.crt"
                    privateKeyFile: "/etc/gateway/tls/0/tls.key"

            ssh:
              gateway:
                username: "gateway"
                key:
                  type: "ed25519"
                hostCertificate:
                  ttl: "24h"
                userCertificate:
                  ttl: "5m"

              ca:
                vault:
                  address: "https://vault.example.com:8200"
                  namespace: "test-namespace"
                  mount: "ssh-gateway"
                  role: "gateway"
                  gatewayHostCA:
                    mount: "ssh-gateway-host"
                    role: "gateway-host"
                  gatewayUserCA:
                    mount: "ssh-gateway-user"
                    role: "gateway-user"
                  upstreamHostCA:
                    mount: "ssh-upstream-host"
  - it: should include SSH with Vault AppRole auth
    set:
      ssh:
        ca:
          vault:
            address: "https://vault.example.com:8200"
            auth:
              appRole:
                roleId: "my-role-id"
                secretId: "my-secret-id"
            mount: "ssh-gateway"
            role: "gateway"
    asserts:
      - equal:
          path: data["config.yaml"]
          value: |-
            twingate:
              network: "acme"
              host: "twingate.com"

            port: 8443
            metricsPort: 9090

            auditLog:
              flushInterval: 5m
              flushSizeThreshold: 1e+06

            tls:
              certificates:
                files:
                  - certificateFile: "/etc/gateway/tls/0/tls.crt"
                    privateKeyFile: "/etc/gateway/tls/0/tls.key"

            ssh:
              gateway:
                username: "gateway"
                key:
                  type: "ed25519"
                hostCertificate:
                  ttl: "24h"
                userCertificate:
                  ttl: "5m"

              ca:
                vault:
                  address: "https://vault.example.com:8200"
                  auth:
                    appRole:
                      mount: "approle"
                      roleID: "my-role-id"
                      secretIDFile: "/etc/gateway/vault/approle/secretId"
                  mount: "ssh-gateway"
                  role: "gateway"
  - it: should error when SSH Gateway username is empty
    set:
      ssh:
        gateway:
          username: ""
        ca:
          manual:
            privateKey: "my-private-key"
    asserts:
      - failedTemplate:
          errorPattern: "ssh.gateway.username is required"
  - it: should error when SSH is enabled but ca is omitted
    set:
      ssh:
        ca: null
    asserts:
      - failedTemplate:
          errorPattern: "at '/ssh': missing property 'ca'"
  - it: should error when SSH is enabled but neither CA backend is configured
    set:
      ssh:
        ca: {}
    asserts:
      - failedTemplate:
          errorPattern: "at '/ssh/ca': 'oneOf' failed, none matched"
  - it: should error when both manual and Vault config are provided
    set:
      ssh:
        ca:
          manual: {}
          vault: {}
    asserts:
      - failedTemplate:
          errorPattern: "at '/ssh/ca': 'oneOf' failed, subschemas 0, 1 matched"
---
