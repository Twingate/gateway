suite: TLS Vault issuer AppRole secret ID secret
templates:
  - tls-vault-approle-secret-id.yaml
set:
  tls:
    certificates:
      autoGenerated:
        enabled: false
    automation:
      enabled: true
      issuer:
        vault:
          address: "https://vault.acme.int:8200"
          role: "my-role"
tests:
  - it: should not render when automation is disabled
    set:
      tls:
        automation:
          enabled: false
          issuer:
            vault:
              auth:
                appRole:
                  roleId: "my-role-id"
                  secretId: "my-secret-id"
    asserts:
      # Empty document
      - notExists:
          path: kind
  - it: should not render when using an existing secret ID secret
    set:
      tls:
        automation:
          issuer:
            vault:
              auth:
                appRole:
                  roleId: "my-role-id"
                  secretIdSecretName: "my-existing-secret"
    asserts:
      # Empty document
      - notExists:
          path: kind
  - it: should render when secretId is specified
    set:
      tls:
        automation:
          issuer:
            vault:
              auth:
                appRole:
                  roleId: "my-role-id"
                  secretId: "my-secret-id"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-tls-vault-approle-secret-id
      - equal:
          path: data
          value:
            secretId: bXktc2VjcmV0LWlk
  - it: should error when secretId is empty
    set:
      tls:
        automation:
          issuer:
            vault:
              auth:
                appRole:
                  roleId: "my-role-id"
                  secretId: ""
    asserts:
      - failedTemplate:
          errorMessage: tls.automation.issuer.vault.auth.appRole.secretId is required
  - it: should error when both secretId and secretIdSecretName are specified
    set:
      tls:
        automation:
          issuer:
            vault:
              auth:
                appRole:
                  roleId: "my-role-id"
                  secretId: "my-secret-id"
                  secretIdSecretName: "my-existing-secret"
    asserts:
      - failedTemplate:
          errorPattern: "at '/tls/automation/issuer/vault/auth/appRole': 'oneOf' failed, subschemas 0, 1 matched"
