suite: TLS local issuer secret
templates:
  - tls-local-issuer-secret.yaml
set:
  tls:
    certificates:
      autoGenerated:
        enabled: false
tests:
  - it: should not render when `tls.automation.enabled` is false
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: true
        automation:
          enabled: false
          issuer:
            local:
              certificate: "my-ca-cert"
              privateKey: "my-ca-key"
    asserts:
      # Empty document
      - notExists:
          path: kind
  - it: should not render when another issuer is configured
    set:
      tls:
        automation:
          enabled: true
          issuer:
            gcpPrivateCA:
              project: "twingate-prod"
              location: "us-east1"
              caPoolId: "gateway-ca"
    asserts:
      # Empty document
      - notExists:
          path: kind
  - it: should not render when using an existing secret
    set:
      tls:
        automation:
          enabled: true
          issuer:
            local:
              secretName: "my-existing-secret"
    asserts:
      # Empty document
      - notExists:
          path: kind
  - it: should render when a certificate and a private key are specified
    set:
      tls:
        automation:
          enabled: true
          issuer:
            local:
              certificate: "my-ca-cert"
              privateKey: "my-ca-key"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-tls-local-issuer
      - equal:
          path: data
          value:
            ca.crt: bXktY2EtY2VydA==
            ca.key: bXktY2Eta2V5
  - it: should error when the certificate is empty
    set:
      tls:
        automation:
          enabled: true
          issuer:
            local:
              certificate: ""
              privateKey: "my-ca-key"
    asserts:
      - failedTemplate:
          errorMessage: tls.automation.issuer.local.certificate is required
  - it: should error when the private key is empty
    set:
      tls:
        automation:
          enabled: true
          issuer:
            local:
              certificate: "my-ca-cert"
              privateKey: ""
    asserts:
      - failedTemplate:
          errorMessage: tls.automation.issuer.local.privateKey is required
