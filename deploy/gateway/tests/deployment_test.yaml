suite: Deployment
templates:
  - deployment.yaml
tests:
  - it: should keep Gateway volumes and volume mounts when other volumes are specified
    set:
      volumes:
        - name: logs
          mountPath: /var/log
      volumeMounts:
        - name: logs
          mountPath: /var/log
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: config
              configMap:
                name: RELEASE-NAME-gateway-config
            - name: tls-certs-0
              secret:
                secretName: RELEASE-NAME-gateway-tls
            - name: logs
              mountPath: /var/log
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
            - name: tls-certs-0
              mountPath: /etc/gateway/tls/0
              readOnly: true
            - name: logs
              mountPath: /var/log
  - it: should mount every certificate
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: true
          secrets:
            - name: my-tls-secret
            - cert: "my-tls-cert"
              key: "my-tls-key"
              ca: "my-ca-cert"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls-certs-0
            secret:
              secretName: RELEASE-NAME-gateway-tls
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls-certs-1
            secret:
              secretName: my-tls-secret
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls-certs-2
            secret:
              secretName: RELEASE-NAME-gateway-tls-1
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-certs-0
            mountPath: /etc/gateway/tls/0
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-certs-1
            mountPath: /etc/gateway/tls/1
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-certs-2
            mountPath: /etc/gateway/tls/2
            readOnly: true
  - it: should set priorityClassName when specified
    set:
      priorityClassName: "myPriorityClass"
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: "myPriorityClass"
  - it: should add extra environment variables
    set:
      extraEnvVars:
        - name: FOO
          value: "bar"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FOO
            value: "bar"
  - it: should mount no certificate when automation is the only certificate source
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: false
        automation:
          issuer:
            gcpPrivateCA:
              project: "twingate-prod"
              location: "us-east1"
              caPoolId: "gateway-ca"
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: tls-certs-0
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-certs-0
          any: true
---
suite: Deployment with SSH
templates:
  - deployment.yaml
set:
  ssh:
    enabled: true
tests:
  - it: should not add SSH manual CA volume and volume mount when `ssh.enabled` is true but `ssh.ca.manual` is not specified
    set:
      ssh:
        ca:
          vault:
            address: "https://vault.example.com:8200"
            role: "gateway"
            auth:
              token: "vault-token"
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: config
              configMap:
                name: RELEASE-NAME-gateway-config
            - name: tls-certs-0
              secret:
                secretName: RELEASE-NAME-gateway-tls
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
            - name: tls-certs-0
              mountPath: /etc/gateway/tls/0
              readOnly: true
  - it: should add SSH manual CA volume and volume mount when `ssh.enabled` is true and `ssh.ca.manual` is specified
    set:
      ssh:
        ca:
          manual:
            privateKey: "my-private-key"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ssh-manual-ca
            mountPath: /etc/gateway/ssh
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ssh-manual-ca
            secret:
              secretName: RELEASE-NAME-gateway-ssh-manual-ca
---
suite: Deployment with SSH and Vault CA
templates:
  - deployment.yaml
set:
  ssh:
    enabled: true
    ca:
      vault:
        address: "https://vault.example.com:8200"
        role: "gateway"
tests:
  - it: should include Vault token env var
    set:
      ssh:
        ca:
          vault:
            auth:
              token: "vault-token"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAULT_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-gateway-ssh-vault-token
                key: token
  - it: should use existing token secret when specified
    set:
      ssh:
        ca:
          vault:
            auth:
              existingTokenSecret: "my-vault-token-secret"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAULT_TOKEN
            valueFrom:
              secretKeyRef:
                name: my-vault-token-secret
                key: token
  - it: should support Vault CA bundle when CA bundle is specified
    set:
      ssh:
        ca:
          vault:
            caBundle: "my-ca-bundle"
            auth:
              token: "my-token"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAULT_CACERT
            value: /etc/gateway/vault/ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: vault-ca-bundle
            mountPath: /etc/gateway/vault
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: vault-ca-bundle
            secret:
              secretName: RELEASE-NAME-gateway-ssh-vault-ca-bundle
  - it: should support Vault CA bundle when existing CA bundle secret is specified
    set:
      ssh:
        ca:
          vault:
            existingCABundleSecret: "my-ca-bundle-secret"
            auth:
              token: "my-token"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAULT_CACERT
            value: /etc/gateway/vault/ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: vault-ca-bundle
            mountPath: /etc/gateway/vault
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: vault-ca-bundle
            secret:
              secretName: my-ca-bundle-secret
  - it: should not add Vault CA bundle when CA bundle is not specified
    set:
      ssh:
        ca:
          vault:
            caBundle: ""
            existingCABundleSecret: ""
            auth:
              token: "my-token"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAULT_CACERT
            value: /etc/gateway/vault/ca.crt
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: vault-ca-bundle
            mountPath: /etc/gateway/vault
            readOnly: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: vault-ca-bundle
            secret:
              secretName: RELEASE-NAME-gateway-ssh-vault-ca-bundle
  - it: should include Vault AppRole Secret ID volume and volumeMount
    set:
      ssh:
        ca:
          vault:
            auth:
              appRole:
                roleId: "my-role-id"
                secretId: "my-secret-id"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: vault-approle-secret-id
            mountPath: /etc/gateway/vault/approle
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: vault-approle-secret-id
            secret:
              secretName: RELEASE-NAME-gateway-ssh-vault-approle-secret-id
  - it: should use existing Vault AppRole Secret ID secret name when specified
    set:
      ssh:
        ca:
          vault:
            auth:
              appRole:
                roleId: "my-role-id"
                existingSecretIdSecret: "my-existing-approle-secret"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: vault-approle-secret-id
            secret:
              secretName: my-existing-approle-secret
  - it: should error when both token and appRole are specified
    set:
      ssh:
        ca:
          vault:
            auth:
              token: "my-token"
              appRole:
                roleId: "my-role-id"
                secretId: "my-secret-id"
    asserts:
      - failedTemplate:
          errorPattern: "at '/ssh/ca/vault/auth': 'oneOf' failed, subschemas 1, 2 matched"
