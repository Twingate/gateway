suite: Deployment
templates:
  - deployment.yaml
tests:
  - it: should keep Gateway volumes and volume mounts when other volumes are specified
    set:
      volumes:
        - name: logs
          mountPath: /var/log
      volumeMounts:
        - name: logs
          mountPath: /var/log
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: config
              configMap:
                name: RELEASE-NAME-gateway-config
            - name: tls-certs-0
              secret:
                secretName: RELEASE-NAME-gateway-tls
            - name: logs
              mountPath: /var/log
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
            - name: tls-certs-0
              mountPath: /etc/gateway/tls/0
              readOnly: true
            - name: logs
              mountPath: /var/log
  - it: should mount every certificate
    set:
      tls:
        certificates:
          autoGenerated:
            enabled: true
          secrets:
            - name: my-tls-secret
            - cert: "my-tls-cert"
              key: "my-tls-key"
              ca: "my-ca-cert"
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: config
              configMap:
                name: RELEASE-NAME-gateway-config
            - name: tls-certs-0
              secret:
                secretName: RELEASE-NAME-gateway-tls
            - name: tls-certs-1
              secret:
                secretName: my-tls-secret
            - name: tls-certs-2
              secret:
                secretName: RELEASE-NAME-gateway-tls-1
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
            - name: tls-certs-0
              mountPath: /etc/gateway/tls/0
              readOnly: true
            - name: tls-certs-1
              mountPath: /etc/gateway/tls/1
              readOnly: true
            - name: tls-certs-2
              mountPath: /etc/gateway/tls/2
              readOnly: true
  - it: should set priorityClassName when specified
    set:
      priorityClassName: "myPriorityClass"
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: "myPriorityClass"
  - it: should add extra environment variables
    set:
      extraEnvVars:
        - name: FOO
          value: "bar"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FOO
            value: "bar"
---
suite: Deployment with SSH
templates:
  - deployment.yaml
set:
  ssh:
    enabled: true
tests:
  - it: should not add SSH manual CA volume and volume mount when `ssh.enabled` is true but `ssh.ca.manual` is not specified
    set:
      ssh:
        ca:
          vault:
            address: "https://vault.example.com:8200"
            role: "gateway"
            auth:
              token: "vault-token"
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: config
              configMap:
                name: RELEASE-NAME-gateway-config
            - name: tls-certs-0
              secret:
                secretName: RELEASE-NAME-gateway-tls
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
            - name: tls-certs-0
              mountPath: /etc/gateway/tls/0
              readOnly: true
  - it: should add SSH manual CA volume and volume mount when `ssh.enabled` is true and `ssh.ca.manual` is specified
    set:
      ssh:
        ca:
          manual:
            privateKey: "my-private-key"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ssh-manual-ca
            mountPath: /etc/gateway/ssh
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ssh-manual-ca
            secret:
              secretName: RELEASE-NAME-gateway-ssh-manual-ca
---
suite: Deployment with SSH and Vault CA
templates:
  - deployment.yaml
set:
  ssh:
    enabled: true
    ca:
      vault:
        address: "https://vault.example.com:8200"
        role: "gateway"
tests:
  - it: should include Vault token env var
    set:
      ssh:
        ca:
          vault:
            auth:
              token: "vault-token"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAULT_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-gateway-ssh-vault-token
                key: token
  - it: should use existing token secret when specified
    set:
      ssh:
        ca:
          vault:
            auth:
              existingTokenSecret: "my-vault-token-secret"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAULT_TOKEN
            valueFrom:
              secretKeyRef:
                name: my-vault-token-secret
                key: token
  - it: should support Vault CA bundle when CA bundle is specified
    set:
      ssh:
        ca:
          vault:
            caBundle: "my-ca-bundle"
            auth:
              token: "my-token"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAULT_CACERT
            value: /etc/gateway/vault/ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: vault-ca-bundle
            mountPath: /etc/gateway/vault
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: vault-ca-bundle
            secret:
              secretName: RELEASE-NAME-gateway-ssh-vault-ca-bundle
  - it: should support Vault CA bundle when existing CA bundle secret is specified
    set:
      ssh:
        ca:
          vault:
            existingCABundleSecret: "my-ca-bundle-secret"
            auth:
              token: "my-token"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAULT_CACERT
            value: /etc/gateway/vault/ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: vault-ca-bundle
            mountPath: /etc/gateway/vault
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: vault-ca-bundle
            secret:
              secretName: my-ca-bundle-secret
  - it: should not add Vault CA bundle when CA bundle is not specified
    set:
      ssh:
        ca:
          vault:
            caBundle: ""
            existingCABundleSecret: ""
            auth:
              token: "my-token"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAULT_CACERT
            value: /etc/gateway/vault/ca.crt
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: vault-ca-bundle
            mountPath: /etc/gateway/vault
            readOnly: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: vault-ca-bundle
            secret:
              secretName: RELEASE-NAME-gateway-ssh-vault-ca-bundle
  - it: should include Vault AppRole Secret ID volume and volumeMount
    set:
      ssh:
        ca:
          vault:
            auth:
              appRole:
                roleId: "my-role-id"
                secretId: "my-secret-id"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: vault-approle-secret-id
            mountPath: /etc/gateway/vault/approle
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: vault-approle-secret-id
            secret:
              secretName: RELEASE-NAME-gateway-ssh-vault-approle-secret-id
  - it: should use existing Vault AppRole Secret ID secret name when specified
    set:
      ssh:
        ca:
          vault:
            auth:
              appRole:
                roleId: "my-role-id"
                existingSecretIdSecret: "my-existing-approle-secret"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: vault-approle-secret-id
            secret:
              secretName: my-existing-approle-secret
  - it: should error when both token and appRole are specified
    set:
      ssh:
        ca:
          vault:
            auth:
              token: "my-token"
              appRole:
                roleId: "my-role-id"
                secretId: "my-secret-id"
    asserts:
      - failedTemplate:
          errorPattern: "at '/ssh/ca/vault/auth': 'oneOf' failed, subschemas 1, 2 matched"
---
suite: Deployment with upstream CA bundles
templates:
  - deployment.yaml
set:
  twingate:
    network: "acme"
tests:
  - it: should not add any upstream CA bundle volume when empty
    set:
      upstreamCABundles: []
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: upstream-ca-bundle-0
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: upstream-ca-bundle-0
          any: true
  - it: should mount an existing ConfigMap under its default key
    set:
      upstreamCABundles:
        - configMapName: "corp-root-ca"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: upstream-ca-bundle-0
            configMap:
              name: corp-root-ca
              items:
                - key: ca.crt
                  path: ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: upstream-ca-bundle-0
            mountPath: /etc/gateway/upstream-ca-bundles/0
            readOnly: true
  - it: should mount an existing ConfigMap under the configured key
    set:
      upstreamCABundles:
        - configMapName: "corp-root-ca"
          configMapKey: "bundle.pem"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: upstream-ca-bundle-0
            configMap:
              name: corp-root-ca
              items:
                - key: bundle.pem
                  path: ca.crt
  - it: should mount inline PEM bundles
    set:
      upstreamCABundles:
        - configMapName: "corp-root-ca"
        - pem: "my-upstream-ca"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: upstream-ca-bundle-1
            configMap:
              name: RELEASE-NAME-gateway-upstream-ca-bundles
              items:
                - key: ca1.crt
                  path: ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: upstream-ca-bundle-1
            mountPath: /etc/gateway/upstream-ca-bundles/1
            readOnly: true
---
suite: Deployment with local issuer TLS automation
templates:
  - deployment.yaml
set:
  tls:
    certificates:
      autoGenerated:
        enabled: false
tests:
  - it: should add the local issuer volume and volume mount
    set:
      tls:
        automation:
          enabled: true
          issuer:
            local:
              certificate: "my-ca-cert"
              privateKey: "my-ca-key"
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: config
              configMap:
                name: RELEASE-NAME-gateway-config
            - name: tls-local-issuer
              secret:
                secretName: RELEASE-NAME-gateway-tls-local-issuer
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
            - name: tls-local-issuer
              mountPath: /etc/gateway/tls/ca
              readOnly: true
  - it: should mount an existing local issuer secret
    set:
      tls:
        automation:
          enabled: true
          issuer:
            local:
              secretName: "my-existing-secret"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls-local-issuer
            secret:
              secretName: my-existing-secret
