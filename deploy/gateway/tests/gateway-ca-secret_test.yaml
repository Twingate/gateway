suite: Gateway CA secret
templates:
  - gateway-ca-secret.yaml
set:
  twingate:
    network: "acme"
  tls:
    certificates:
      autoGenerated:
        enabled: false
    automation:
      enabled: true
      issuer:
        gcpPrivateCA:
          project: "twingate-prod"
          location: "us-east1"
          caPoolId: "gateway-ca"
tests:
  - it: should render the CA certificate
    set:
      twingateOperator:
        gateway:
          enabled: true
          certificateAuthority:
            certificate: my-ca-cert
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-ca
      - equal:
          path: data["ca.crt"]
          value: bXktY2EtY2VydA==
  - it: should render nothing when the operator is disabled
    set:
      twingateOperator:
        gateway:
          enabled: false
          certificateAuthority:
            certificate: my-ca-cert
    asserts:
      - hasDocuments:
          count: 0
  - it: should render nothing when referencing an existing Secret
    set:
      twingateOperator:
        gateway:
          enabled: true
          certificateAuthority:
            name: my-ca
            certificate: "my-ca-cert" # Ignore inline certificate when name is specified
            certificateSecretName: issuer-ca
    asserts:
      - hasDocuments:
          count: 0
