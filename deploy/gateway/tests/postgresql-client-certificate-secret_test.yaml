suite: PostgreSQL client certificate secret
templates:
  - postgresql-client-certificate-secret.yaml
set:
  twingate:
    network: "acme"
tests:
  - it: should not render when `postgresql.enabled` is false
    set:
      postgresql:
        enabled: false
        credentials:
          - name: "editor"
            passwordSecretName: "editor-password"
            clientCertificate:
              certificate: "my-client-certificate"
              privateKey: "my-client-private-key"
    asserts:
      - hasDocuments:
          count: 0
  - it: should not render when the client certificate comes from an existing Secret
    set:
      postgresql:
        enabled: true
        credentials:
          - name: "editor"
            passwordSecretName: "editor-password"
            clientCertificate:
              secretName: "editor-client-certificate"
    asserts:
      - hasDocuments:
          count: 0
  - it: should render a Secret for an inline client certificate
    set:
      postgresql:
        enabled: true
        credentials:
          - name: "viewer"
            passwordSecretName: "viewer-password"
          - name: "editor"
            passwordSecretName: "editor-password"
            clientCertificate:
              certificate: "my-client-certificate"
              privateKey: "my-client-private-key"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gateway-postgresql-client-certificate-1
      - equal:
          path: type
          value: kubernetes.io/tls
      - equal:
          path: data
          value:
            tls.crt: bXktY2xpZW50LWNlcnRpZmljYXRl
            tls.key: bXktY2xpZW50LXByaXZhdGUta2V5
  - it: should fail when an inline client certificate is empty
    set:
      postgresql:
        enabled: true
        credentials:
          - name: "editor"
            passwordSecretName: "editor-password"
            clientCertificate:
              certificate: ""
              privateKey: "my-client-private-key"
    asserts:
      - failedTemplate:
          errorPattern: "postgresql\\.credentials\\[0\\]\\.clientCertificate\\.certificate is required"
  - it: should fail when an inline client private key is empty
    set:
      postgresql:
        enabled: true
        credentials:
          - name: "editor"
            passwordSecretName: "editor-password"
            clientCertificate:
              certificate: "my-client-certificate"
              privateKey: ""
    asserts:
      - failedTemplate:
          errorPattern: "postgresql\\.credentials\\[0\\]\\.clientCertificate\\.privateKey is required"
