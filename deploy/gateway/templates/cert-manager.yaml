{{- if include "gateway.tlsEngineIsCertManager" . }}
{{- $cm := .Values.tls.certificates.autoGenerated.certManager }}
{{- $fullname := include "gateway.fullname" . }}
{{- $dnsNames := include "gateway.tlsDnsNames" . | fromJsonArray }}
{{- include "gateway.requireTlsNames" . }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-crt" $fullname }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  secretName: {{ include "gateway.tlsAutoGeneratedSecretName" . }}
  issuerRef:
    name: {{ required "tls.certificates.autoGenerated.certManager.issuerRef.name is required when tls.certificates.autoGenerated.certManager.enabled is true" $cm.issuerRef.name }}
    kind: {{ $cm.issuerRef.kind }}
    group: {{ $cm.issuerRef.group }}
  {{- with $cm.commonName }}
  commonName: {{ . | quote }}
  {{- end }}
  {{- with $dnsNames }}
  dnsNames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- with .Values.tls.certificates.autoGenerated.ipAddresses }}
  ipAddresses:
    {{- range . }}
    - {{ . }}
    {{- end }}
  {{- end }}
  {{- with $cm.duration }}
  duration: {{ . }}
  {{- end }}
  {{- with $cm.renewBefore }}
  renewBefore: {{ . }}
  {{- end }}
{{- end }}
