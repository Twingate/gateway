apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway.configMapName" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
data:
  config.yaml: |-
    twingate:
      network: {{ required "twingate.network is required" .Values.twingate.network | quote }}
      host: {{ include "gateway.twingate.host" . | quote }}

    {{ with .Values.containerPorts -}}
    port: {{ .https }}
    metricsPort: {{ .metrics }}
    {{- end }}

    {{ with .Values.log.sessionRecording.segment -}}
    log:
      sessionRecording:
        segment:
          maxDuration: {{ .maxDuration | quote }}
          maxSize: {{ .maxSize | quote }}
    {{- end }}

    tls:
      {{- with (include "gateway.tlsSecretNames" . | fromJsonArray) }}
      certificates:
        files:
          {{- range $i, $name := . }}
          - certificateFile: "/etc/gateway/tls/{{ $i }}/tls.crt"
            privateKeyFile: "/etc/gateway/tls/{{ $i }}/tls.key"
          {{- end }}
      {{- end }}
      {{- if .Values.tls.automation.enabled }}
      automation:
        {{- with .Values.tls.automation.certificate }}
        certificate:
          {{- with .ttl }}
          ttl: {{ . | quote }}
          {{- end }}
          {{- with .key }}
          key:
            type: {{ .type | quote }}
            {{- with .bits }}
            bits: {{ . }}
            {{- end }}
          {{- end }}
        {{- end }}
        issuer:
          {{- with .Values.tls.automation.issuer.local }}
          local:
            certificateFile: "/etc/gateway/tls/ca/ca.crt"
            privateKeyFile: "/etc/gateway/tls/ca/ca.key"
          {{- end }}
          {{- with .Values.tls.automation.issuer.vault }}
          vault:
            address: {{ required "tls.automation.issuer.vault.address is required" .address | quote }}
            {{- with .namespace }}
            namespace: {{ . | quote }}
            {{- end }}
            {{- if or .caBundle .caBundleConfigMapName }}
            caBundleFile: "/etc/gateway/tls/vault/ca.crt"
            {{- end }}
            {{- if and .auth .auth.appRole }}
            auth:
              appRole:
                mount: {{ default "approle" .auth.appRole.mount | quote }}
                roleID: {{ required "tls.automation.issuer.vault.auth.appRole.roleId is required" .auth.appRole.roleId | quote }}
                secretIDFile: "/etc/gateway/tls/vault/approle/secretId"
            {{- end }}
            mount: {{ default "pki" .mount | quote }}
            role: {{ required "tls.automation.issuer.vault.role is required" .role | quote }}
          {{- end }}
          {{- with .Values.tls.automation.issuer.gcpPrivateCA }}
          gcpPrivateCA:
            project: {{ required "tls.automation.issuer.gcpPrivateCA.project is required" .project | quote }}
            location: {{ required "tls.automation.issuer.gcpPrivateCA.location is required" .location | quote }}
            caPoolID: {{ required "tls.automation.issuer.gcpPrivateCA.caPoolId is required" .caPoolId | quote }}
            {{- with .issuingCertificateAuthorityId }}
            issuingCertificateAuthorityID: {{ . | quote }}
            {{- end }}
          {{- end }}
      {{- end }}

    {{- with include "gateway.upstreamCABundleSources" . | fromJsonArray }}

    upstreamCABundles:
      {{- range $i, $source := . }}
      - file: "/etc/gateway/upstream-ca-bundles/{{ $i }}/ca.crt"
      {{- end }}
    {{- end }}

    {{- $resourceEnabled := and .Values.twingateOperator.kubernetesResource .Values.twingateOperator.kubernetesResource.enabled -}}
    {{- $k8sEnabled := and .Values.kubernetes .Values.kubernetes.enabled }}

    {{ if and $k8sEnabled .Values.kubernetes.upstreams -}}
    kubernetes:
      upstreams:
        {{- .Values.kubernetes.upstreams | toYaml | nindent 8 }}
    {{ else if or $resourceEnabled $k8sEnabled -}}
    kubernetes: {}
    {{ end -}}

    {{ with .Values.ssh -}}
    {{ if .enabled -}}
    ssh:
      {{- with .gateway }}
      gateway:
        username: {{ required "ssh.gateway.username is required" .username | quote }}
        key:
          type: {{ .key.type | quote }}
          {{- with .key.bits }}
          bits: {{ . }}
          {{- end }}
        hostCertificate:
          ttl: {{ .hostCertificate.ttl | quote }}
        userCertificate:
          ttl: {{ .userCertificate.ttl | quote }}
      {{- end }}
      {{- if and .ca .ca.manual }}

      ca:
        manual:
          privateKeyFile: "/etc/gateway/ssh/ca-private-key"
      {{- end }}
      {{- if and .ca .ca.vault }}

      ca:
        vault:
          address: {{ .ca.vault.address | quote }}
          {{- with .ca.vault.namespace }}
          namespace: {{ . | quote }}
          {{- end }}
          {{- if or .ca.vault.caBundle .ca.vault.existingCABundleSecret }}
          caBundleFile: "/etc/gateway/vault/ca.crt"
          {{- end }}
          {{- if and .ca.vault.auth .ca.vault.auth.appRole }}
          auth:
            appRole:
              mount: {{ default "approle" .ca.vault.auth.appRole.mount | quote }}
              roleID: {{ .ca.vault.auth.appRole.roleId | quote }}
              secretIDFile: "/etc/gateway/vault/approle/secretId"
          {{- end }}
          mount: {{ default "ssh" .ca.vault.mount | quote }}
          role: {{ .ca.vault.role | quote }}
          {{- with .ca.vault.gatewayHostCA }}
          gatewayHostCA:
            {{- with .mount }}
            mount: {{ . | quote }}
            {{- end }}
            {{- with .role }}
            role: {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- with .ca.vault.gatewayUserCA }}
          gatewayUserCA:
            {{- with .mount }}
            mount: {{ . | quote }}
            {{- end }}
            {{- with .role }}
            role: {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- with .ca.vault.upstreamHostCA }}
          upstreamHostCA:
            {{- with .mount }}
            mount: {{ . | quote }}
            {{- end }}
          {{- end }}
      {{- end }}
    {{ end -}}
    {{ end -}}

    {{ with .Values.webApp -}}
    {{ if .enabled -}}
    {{ with .requestHeaders -}}
    webApp:
      requestHeaders:
        {{- . | toYaml | nindent 8 }}
    {{ else -}}
    webApp: {}
    {{ end -}}
    {{ end -}}
    {{ end -}}
