{{- $certificateAuthority := .Values.twingateOperator.gateway.certificateAuthority | default dict }}
{{- if and .Values.twingateOperator.gateway.enabled $certificateAuthority.certificate (not $certificateAuthority.certificateSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.certificateAuthoritySecretName" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ $certificateAuthority.certificate | b64enc }}
{{- end }}
