{{- if .Values.postgresql.enabled }}
{{- $secretNames := include "gateway.postgresqlPasswordSecretNames" . | fromJsonArray }}
{{- range $i, $credential := .Values.postgresql.credentials }}
{{- if not $credential.passwordSecretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $secretNames $i }}
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
type: Opaque
data:
  password: {{ required (printf "postgresql.credentials[%d].password is required" $i) $credential.password | b64enc }}
{{- end }}
{{- end }}
{{- end }}
