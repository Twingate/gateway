{{- $inlineBundles := dict }}
{{- range $i, $bundle := .Values.upstreamCABundles }}
{{- if and (not $bundle.configMapName) $bundle.pem }}
{{- $_ := set $inlineBundles (printf "ca%d.crt" $i) $bundle.pem }}
{{- end }}
{{- end }}
{{- if $inlineBundles }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway.upstreamCABundlesConfigMapName" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
data:
  {{- range $key, $pem := $inlineBundles }}
  {{ $key }}: |
    {{- $pem | trim | nindent 4 }}
  {{- end }}
{{- end }}
