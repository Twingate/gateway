{{- $manualCAEnabled := and .Values.ssh.enabled .Values.ssh.ca .Values.ssh.ca.manual -}}
{{- $sshVaultCABundleEnabled := and .Values.ssh.enabled .Values.ssh.ca .Values.ssh.ca.vault (or .Values.ssh.ca.vault.caBundle .Values.ssh.ca.vault.caBundleConfigMapName) -}}
{{- $sshVaultAppRoleEnabled := and .Values.ssh.enabled .Values.ssh.ca .Values.ssh.ca.vault .Values.ssh.ca.vault.auth .Values.ssh.ca.vault.auth.appRole -}}
{{- $tlsVaultIssuerEnabled := and .Values.tls.automation.enabled .Values.tls.automation.issuer.vault -}}
{{- $tlsVaultIssuerCABundleEnabled := and $tlsVaultIssuerEnabled (or .Values.tls.automation.issuer.vault.caBundle .Values.tls.automation.issuer.vault.caBundleConfigMapName) -}}
{{- $tlsVaultIssuerAppRoleEnabled := and $tlsVaultIssuerEnabled .Values.tls.automation.issuer.vault.auth .Values.tls.automation.issuer.vault.auth.appRole -}}
{{- $tlsSecretNames := include "gateway.tlsSecretNames" . | fromJsonArray -}}
{{- $tlsLocalIssuerEnabled := and .Values.tls.automation.enabled .Values.tls.automation.issuer.local -}}
{{- $upstreamCABundles := include "gateway.upstreamCABundleSources" . | fromJsonArray -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gateway.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gateway.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          env:
            - name: TWINGATE_CONFIG
              value: /etc/gateway/config.yaml
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.containerPorts.https }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.containerPorts.metrics }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
            {{- range $i, $name := $tlsSecretNames }}
            - name: tls-certs-{{ $i }}
              mountPath: /etc/gateway/tls/{{ $i }}
              readOnly: true
            {{- end }}
            {{- if $tlsLocalIssuerEnabled }}
            - name: tls-local-issuer
              mountPath: /etc/gateway/tls/ca
              readOnly: true
            {{- end }}
            {{- range $i, $source := $upstreamCABundles }}
            - name: upstream-ca-bundle-{{ $i }}
              mountPath: /etc/gateway/upstream-ca-bundles/{{ $i }}
              readOnly: true
            {{- end }}
            {{- if $tlsVaultIssuerCABundleEnabled }}
            - name: tls-vault-issuer-ca-bundle
              mountPath: /etc/gateway/tls/vault
              readOnly: true
            {{- end }}
            {{- if $tlsVaultIssuerAppRoleEnabled }}
            - name: tls-vault-issuer-approle-secret-id
              mountPath: /etc/gateway/tls/vault/approle
              readOnly: true
            {{- end }}
            {{- if .Values.ssh.enabled }}
            {{- if $manualCAEnabled }}
            - name: ssh-manual-ca
              mountPath: /etc/gateway/ssh
              readOnly: true
            {{- end }}
            {{- if $sshVaultCABundleEnabled }}
            - name: ssh-vault-ca-bundle
              mountPath: /etc/gateway/vault
              readOnly: true
            {{- end }}
            {{- if $sshVaultAppRoleEnabled }}
            - name: ssh-vault-approle-secret-id
              mountPath: /etc/gateway/vault/approle
              readOnly: true
            {{- end }}
            {{- end }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gateway.configMapName" . }}
        {{- range $i, $name := $tlsSecretNames }}
        - name: tls-certs-{{ $i }}
          secret:
            secretName: {{ $name }}
        {{- end }}
        {{- if $tlsLocalIssuerEnabled }}
        - name: tls-local-issuer
          secret:
            secretName: {{ include "gateway.tlsLocalIssuerSecretName" . }}
        {{- end }}
        {{- range $i, $source := $upstreamCABundles }}
        - name: upstream-ca-bundle-{{ $i }}
          configMap:
            name: {{ $source.configMapName | quote }}
            items:
              - key: {{ $source.key | quote }}
                path: ca.crt
        {{- end }}
        {{- if $tlsVaultIssuerCABundleEnabled }}
        - name: tls-vault-issuer-ca-bundle
          configMap:
            name: {{ include "gateway.tlsVaultIssuerCABundleConfigMapName" . }}
        {{- end }}
        {{- if $tlsVaultIssuerAppRoleEnabled }}
        - name: tls-vault-issuer-approle-secret-id
          secret:
            secretName: {{ include "gateway.tlsVaultIssuerAppRoleSecretIdSecretName" . }}
        {{- end }}
        {{- if .Values.ssh.enabled }}
        {{- if $manualCAEnabled }}
        - name: ssh-manual-ca
          secret:
            secretName: {{ include "gateway.sshManualCASecretName" . }}
        {{- end }}
        {{- if $sshVaultCABundleEnabled }}
        - name: ssh-vault-ca-bundle
          configMap:
            name: {{ include "gateway.sshVaultCABundleConfigMapName" . }}
        {{- end }}
        {{- if $sshVaultAppRoleEnabled }}
        - name: ssh-vault-approle-secret-id
          secret:
            secretName: {{ include "gateway.sshVaultAppRoleSecretIdSecretName" . }}
        {{- end }}
        {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
