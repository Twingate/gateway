{{- $checksumAnnotation := "checksum/alternativeNames" }}
{{- include "gateway.requireTlsCertificates" . }}
{{- if include "gateway.tlsEngineIsHelm" . }}
{{- $secretName := include "gateway.tlsAutoGeneratedSecretName" . }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $alternativeNamesHash := include "gateway.alternativeNamesHash" . }}
{{- $existingAlternativeNamesHash := include "gateway.existingAlternativeNamesHash" . }}
{{- include "gateway.requireTlsNames" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    {{ $checksumAnnotation }}: {{ $alternativeNamesHash }}
type: kubernetes.io/tls
data:
  {{- if and $existingSecret.data (eq $existingAlternativeNamesHash $alternativeNamesHash) }}
  # Reuse existing secret if its alternative names do not change
  tls.crt: {{ get $existingSecret.data "tls.crt" }}
  tls.key: {{ get $existingSecret.data "tls.key" }}
  ca.crt: {{ get $existingSecret.data "ca.crt" }}
  {{- else }}
  {{- $serviceName := include "gateway.fullname" . }}
  {{- include "gateway.generateCA" .}}
  {{- $ca := .Values._generatedCA }}
  {{- $dnsNames := include "gateway.tlsDnsNames" . | fromJsonArray }}
  {{- $tls := genSignedCert $serviceName .Values.tls.certificates.autoGenerated.ipAddresses $dnsNames 365 $ca }}
  tls.crt: {{ $tls.Cert | b64enc }}
  tls.key: {{ $tls.Key | b64enc }}
  ca.crt: {{ $ca.Cert | b64enc }}
  {{- end }}
{{- end }}
{{- $secretNames := include "gateway.tlsProvidedSecretNames" . | fromJsonArray }}
{{- range $i, $secret := .Values.tls.certificates.secrets }}
{{- if not $secret.name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $secretNames $i }}
type: kubernetes.io/tls
data:
  tls.crt: {{ required (printf "tls.certificates.secrets[%d].cert is required" $i) $secret.cert | b64enc }}
  tls.key: {{ required (printf "tls.certificates.secrets[%d].key is required" $i) $secret.key | b64enc }}
  ca.crt: {{ required (printf "tls.certificates.secrets[%d].ca is required" $i) $secret.ca | b64enc }}
{{- end }}
{{- end }}
