{{- if .Values.postgresql.enabled }}
{{- $secretNames := include "gateway.postgresqlClientCertificateSecretNames" . | fromJsonArray }}
{{- range $i, $credential := .Values.postgresql.credentials }}
{{- with $credential.clientCertificate }}
{{- if not .secretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $secretNames $i }}
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ required (printf "postgresql.credentials[%d].clientCertificate.certificate is required" $i) .certificate | b64enc }}
  tls.key: {{ required (printf "postgresql.credentials[%d].clientCertificate.privateKey is required" $i) .privateKey | b64enc }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
