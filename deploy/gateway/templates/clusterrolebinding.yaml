apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-cluster-role-binding" (include "gateway.serviceAccountName" .) | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-cluster-role" (include "gateway.serviceAccountName" .) | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gateway.serviceAccountName" . | quote }}
    namespace: {{ .Release.Namespace }}
