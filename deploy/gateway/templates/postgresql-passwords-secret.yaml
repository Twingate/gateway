{{- if and .Values.postgresql .Values.postgresql.enabled .Values.postgresql.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.postgresqlPasswordsSecretName" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range .Values.postgresql.credentials }}
  {{ include "gateway.postgresqlCredentialKey" . }}: {{ required (printf "postgresql.credentials[name=%s].password is required" .name) .password | b64enc }}
  {{- end }}
{{- end }}
