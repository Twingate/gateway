{{- if and .Values.tls.automation.enabled .Values.tls.automation.issuer.vault .Values.tls.automation.issuer.vault.auth .Values.tls.automation.issuer.vault.auth.appRole (not .Values.tls.automation.issuer.vault.auth.appRole.secretIdSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.tlsVaultAppRoleSecretIdSecretName" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
type: Opaque
data:
  secretId: {{ required "tls.automation.issuer.vault.auth.appRole.secretId is required" .Values.tls.automation.issuer.vault.auth.appRole.secretId | b64enc }}
{{- end }}
